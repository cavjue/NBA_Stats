<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog | NBA Stats</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar-content">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="stats.html">Stats</a></li>
                    <li><a href="blog.html">Blog</a></li>
                </ul>
                <div class="search-container">
                    <input 
                        type="text" 
                        id="playerSearch" 
                        class="search-input" 
                        placeholder="Search players..."
                        autocomplete="off"
                    >
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>
        </nav>

        <div class="performance">
            <h3>Performance</h3>
            <div class="performance-grid">
                <div class="metric-card">
                    <h4>Profit</h4>
                    <p id="profitValue">$0.00</p>
                </div>
                <div class="metric-card">
                    <h4>ROI</h4>
                    <p id="roiValue">0.0%</p>
                </div>
                <div class="metric-card record-card">
                    <h4>Record</h4>
                    <p id="recordValue">0-0</p>
                </div>
            </div>

            <div id="betDetails" class="bet-details">
                <div class="bet-details-empty">No bet data loaded.</div>
            </div>
        </div>

        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                min-height: 100vh;
                background: #fff;
                color: #111;
            }

            .navbar {
                border-bottom: 1px solid #ddd;
                padding: 0;
                position: static;
                z-index: 100;
            }

            .navbar-content {
                max-width: 1200px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 20px;
                gap: 20px;
            }

            .nav-links {
                display: flex;
                list-style: none;
                gap: 24px;
            }

            .nav-links a {
                color: #555;
                text-decoration: none;
                font-size: 14px;
            }

            .search-container {
                flex: 1;
                max-width: 400px;
                position: relative;
            }

            .search-input {
                width: 100%;
                padding: 10px 14px;
                background: #fff;
                border: 1px solid #ccc;
                border-radius: 4px;
                color: #111;
                font-size: 14px;
            }

            .performance {
                max-width: 1200px;
                margin: 28px auto 0;
                padding: 0 20px 40px;
            }

            .performance h3 {
                font-size: 26px;
                margin-bottom: 20px;
                font-weight: 700;
            }

            .performance-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(220px, 1fr));
                gap: 20px;
                margin-bottom: 20px;
            }

            .metric-card {
                background: #f2f2f2;
                border: 1px solid #d8d8d8;
                border-radius: 8px;
                min-height: 180px;
                padding: 18px 20px;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }

            .metric-card h4 {
                font-size: 20px;
                margin: 0 0 22px;
                font-weight: 700;
            }

            .metric-card p {
                font-size: 22px;
                margin: 0;
                font-weight: 400;
            }

            .record-card p {
                font-size: 20px;
                font-weight: 700;
            }

            .bet-details {
                background: #f2f2f2;
                border: 1px solid #d8d8d8;
                border-radius: 8px;
                padding: 0;
                overflow: hidden;
            }

            .bet-details-empty {
                padding: 18px 20px;
                color: #666;
            }

            .bet-entry {
                border-top: 1px solid #d8d8d8;
                padding: 14px 20px;
            }

            .bet-entry:first-child {
                border-top: none;
            }

            .bet-entry-row {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                align-items: center;
                padding: 8px 0;
            }

            .bet-entry-row .label {
                font-weight: 600;
                color: #111;
            }

            .bet-entry-row .value {
                color: #333;
                font-weight: 400;
            }

            .bet-entry-row .value.status-won {
                color: #177a3d;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 12px;
            }

            .bet-entry-row .value.status-lost {
                color: #a62b2b;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 12px;
            }

            .bet-entry-row .value.status-pending {
                color: #6a6a6a;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 12px;
            }

            @media (max-width: 900px) {
                .performance-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>

        <script>
            const BET_ROWS = [
                {
                    created_at: "2026-10-17",
                    sportsbook: "PrizePicks",
                    sport: "basketball",
                    league: "WNBA",
                    event_name: "Atlanta Dream vs Golden State Valkyries",
                    game_id: "19515",
                    market_name: "Player Points",
                    bet_name: "Angel Reese Over 9.5",
                    odds: "-119",
                    stake: "5",
                    potential_payout: "15",
                    status: "won",
                    bet_type: "parlay",
                    bet_profit: "10",
                    is_live_bet: "False",
                    is_free_bet: "False",
                    is_odds_boost: "False",
                    parlay_id: "11111",
                    tags: ""
                },
                {
                    created_at: "2026-10-17",
                    sportsbook: "PrizePicks",
                    sport: "basketball",
                    league: "WNBA",
                    event_name: "Atlanta Dream vs Golden State Valkyries",
                    game_id: "19515",
                    market_name: "Player Fantasy Score",
                    bet_name: "Tiffany Hayes Over 16",
                    odds: "-119",
                    stake: "5",
                    potential_payout: "15",
                    status: "won",
                    bet_type: "parlay",
                    bet_profit: "10",
                    is_live_bet: "False",
                    is_free_bet: "False",
                    is_odds_boost: "False",
                    parlay_id: "11111",
                    tags: ""
                }
            ];

            function computeRecord(rows) {
                let wins = 0;
                let losses = 0;

                rows.forEach(row => {
                    const status = (row.status || "").toLowerCase();
                    if (status === "won") wins++;
                    else if (status === "lost") losses++;
                });

                return { wins, losses };
            }

            function getParlayProfit(rows) {
                const grouped = new Map();

                rows.forEach(row => {
                    const parlayId = String(row.parlay_id || "single").trim() || "single";
                    if (!grouped.has(parlayId)) {
                        grouped.set(parlayId, {
                            stake: Number(String(row.stake || "0").replace(/[^0-9.-]/g, "")) || 0,
                            payout: Number(String(row.potential_payout || row.payout || "0").replace(/[^0-9.-]/g, "")) || 0,
                            status: (row.status || "").toLowerCase()
                        });
                    }
                });

                let totalProfit = 0;
                let totalStake = 0;

                grouped.forEach((entry, key) => {
                    totalStake += entry.stake;
                    if (entry.status === "won") {
                        totalProfit += entry.payout - entry.stake;
                    } else if (entry.status === "lost") {
                        totalProfit -= entry.stake;
                    }
                });

                return { totalProfit, totalStake };
            }

            function groupByParlay(rows) {
                const map = new Map();

                rows.forEach(row => {
                    const parlayId = String(row.parlay_id || "single").trim() || "single";

                    if (!map.has(parlayId)) {
                        map.set(parlayId, { id: parlayId, legs: [] });
                    }

                    const group = map.get(parlayId);
                    const status = (row.status || "").toLowerCase();

                    group.legs.push({
                        name: row.bet_name || row.market_name || "Bet",
                        sportsbook: row.sportsbook || "Unknown",
                        status: status === "won" ? "won" : status === "lost" ? "lost" : "pending"
                    });
                });

                return [...map.values()];
            }

            function renderDashboard(rows) {
                const record = computeRecord(rows);
                const profitInfo = getParlayProfit(rows);

                document.getElementById("recordValue").textContent = `${record.wins}-${record.losses}`;
                document.getElementById("profitValue").textContent = `$${profitInfo.totalProfit.toFixed(2)}`;

                const roi = profitInfo.totalStake > 0 ? (profitInfo.totalProfit / profitInfo.totalStake) * 100 : 0;
                document.getElementById("roiValue").textContent = `${roi.toFixed(1)}%`;

                const details = document.getElementById("betDetails");
                const groups = groupByParlay(rows);

                if (!groups.length) {
                    details.innerHTML = '<div class="bet-details-empty">No bet data loaded.</div>';
                    return;
                }

                details.innerHTML = groups.map(group => {
                    const groupStatus = group.legs.some(leg => leg.status === "won") && !group.legs.some(leg => leg.status === "lost")
                        ? "won"
                        : group.legs.some(leg => leg.status === "lost") ? "lost" : "pending";

                    return `
                        <div class="bet-entry">
                            <div class="bet-entry-row">
                                <span class="label">Parlay #${group.id}</span>
                                <span class="value status-${groupStatus}">${groupStatus}</span>
                            </div>
                            ${group.legs.map(leg => `
                                <div class="bet-entry-row">
                                    <span class="label">${leg.name}</span>
                                    <span class="value">${leg.sportsbook}</span>
                                </div>
                            `).join("")}
                        </div>
                    `;
                }).join("");
            }

            renderDashboard(BET_ROWS);
        </script>
    </body>
</html>
