<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog | NBA Stats</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar-content">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="stats.html">Stats</a></li>
                    <li><a href="blog.html">Blog</a></li>
                </ul>
                <div class="search-container">
                    <input 
                        type="text" 
                        id="playerSearch" 
                        class="search-input" 
                        placeholder="Search players..."
                        autocomplete="off"
                    >
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>
        </nav>
 
        <div class="performance">
            <h3>Performance</h3>
            <div class="performance-grid">
                <div class="metric-card">
                    <h4>Profit</h4>
                    <p id="profitValue">$0.00</p>
                </div>
                <div class="metric-card">
                    <h4>ROI</h4>
                    <p id="roiValue">0.0%</p>
                </div>
                <div class="metric-card record-card">
                    <h4>Record</h4>
                    <p id="recordValue">0-0</p>
                </div>
            </div>

            <div id="betDetails" class="bet-details">
                <div class="bet-details-empty">No bet data loaded.</div>
            </div>
        </div>

        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                min-height: 100vh;
                background: #fff;
                color: #111;
            }

            .navbar {
                border-bottom: 1px solid #ddd;
                padding: 0;
                position: static;
                z-index: 100;
            }

            .navbar-content {
                max-width: 1200px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 20px;
                gap: 20px;
            }

            .nav-links {
                display: flex;
                list-style: none;
                gap: 24px;
            }

            .nav-links a {
                color: #555;
                text-decoration: none;
                font-size: 14px;
            }

            .search-container {
                flex: 1;
                max-width: 400px;
                position: relative;
            }

            .search-input {
                width: 100%;
                padding: 10px 14px;
                background: #fff;
                border: 1px solid #ccc;
                border-radius: 4px;
                color: #111;
                font-size: 14px;
            }

            .performance {
                max-width: 1200px;
                margin: 28px auto 0;
                padding: 0 20px 40px;
            }

            .performance h3 {
                font-size: 26px;
                margin-bottom: 20px;
                font-weight: 700;
            }

            .performance-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(220px, 1fr));
                gap: 20px;
                margin-bottom: 20px;
            }

            .metric-card {
                background: #f2f2f2;
                border: 1px solid #d8d8d8;
                border-radius: 8px;
                min-height: 180px;
                padding: 18px 20px;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }

            .metric-card h4 {
                font-size: 20px;
                margin: 0 0 22px;
                font-weight: 700;
            }

            .metric-card p {
                font-size: 22px;
                margin: 0;
                font-weight: 400;
            }

            .record-card p {
                font-size: 20px;
                font-weight: 700;
            }

            .bet-details {
                background: #f2f2f2;
                border: 1px solid #d8d8d8;
                border-radius: 8px;
                padding: 0;
                overflow: hidden;
            }

            .bet-details-empty {
                padding: 18px 20px;
                color: #666;
            }

            .bet-entry {
                border-top: 1px solid #d8d8d8;
                padding: 14px 20px;
            }

            .bet-entry:first-child {
                border-top: none;
            }

            .bet-entry-row {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                align-items: center;
                padding: 8px 0;
            }

            .bet-entry-row .label {
                font-weight: 600;
                color: #111;
            }

            .bet-entry-row .value {
                color: #333;
                font-weight: 400;
            }

            .bet-entry-row .value.status-won {
                color: #177a3d;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 12px;
            }

            .bet-entry-row .value.status-lost {
                color: #a62b2b;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 12px;
            }

            .bet-entry-row .value.status-pending {
                color: #6a6a6a;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 12px;
            }

            .parlay-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
                padding-bottom: 8px;
            }

            .parlay-header-left {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

            .parlay-header .label {
                font-size: 18px;
                font-weight: 700;
            }

            .sportsbook-tag {
                font-size: 12px;
                color: #555;
                background: rgba(0, 0, 0, 0.04);
                border: 1px solid #d8d8d8;
                border-radius: 4px;
                padding: 4px 8px;
                line-height: 1.2;
            }

            .parlay-profit {
                min-width: 120px;
                text-align: right;
                font-weight: 700;
                font-size: 14px;
                display: inline-flex;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
                padding-left: 8px;
            }

            .parlay-profit.profit-win {
                color: #177a3d;
            }

            .parlay-profit.profit-loss {
                color: #a62b2b;
            }

            .parlay-profit.profit-pending {
                color: #6a6a6a;
            }

            @media (max-width: 900px) {
                .performance-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>

        <script>
            const BET_ROWS = [];

            function parseCsvLine(line) {
                const values = [];
                let current = "";
                let inQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];

                    if (char === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        values.push(current);
                        current = "";
                    } else {
                        current += char;
                    }
                }

                values.push(current);
                return values.map(value => value.trim());
            }

            function parseCsv(csvText) {
                const lines = csvText.trim().split(/\r?\n/).filter(Boolean);
                if (!lines.length) return [];

                const headers = parseCsvLine(lines[0]);

                return lines.slice(1).map(line => {
                    const values = parseCsvLine(line);
                    const row = {};

                    headers.forEach((header, index) => {
                        row[header] = values[index] ?? "";
                    });

                    return row;
                });
            }

            async function loadBetRows() {
                try {
                    const response = await fetch("Data/bet_log.csv");
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const csvText = await response.text();
                    const rows = parseCsv(csvText);
                    BET_ROWS.length = 0;
                    BET_ROWS.push(...rows);
                    renderDashboard(BET_ROWS);
                } catch (error) {
                    console.error("Failed to load bet_log.csv:", error);
                    renderDashboard(BET_ROWS);
                }
            }

            function computeRecord(rows) {
                let wins = 0;
                let losses = 0;

                rows.forEach(row => {
                    const status = (row.status || "").toLowerCase();
                    if (status === "won") wins++;
                    else if (status === "lost") losses++;
                });

                return { wins, losses };
            }

            function parseMoney(value) {
                if (value === null || value === undefined || value === "") return 0;
                const cleaned = String(value).replace(/[$,]/g, "").trim();
                const parsed = Number(cleaned);
                return Number.isFinite(parsed) ? parsed : 0;
            }

            function getStatusValue(rawStatus) {
                const status = String(rawStatus || "").toLowerCase();
                if (status === "won") return "won";
                if (status === "lost") return "lost";
                return "pending";
            }

            function getLegProfit(row) {
                const status = getStatusValue(row.status);
                const betProfit = parseMoney(row.bet_profit);
                if (betProfit !== 0 || (row.bet_profit !== undefined && String(row.bet_profit).trim() !== "")) {
                    return betProfit;
                }

                const stake = parseMoney(row.stake);
                const payout = parseMoney(row.potential_payout || row.payout);

                if (status === "won") {
                    return payout > 0 ? payout - stake : 0;
                }

                if (status === "lost") {
                    return -stake;
                }

                return 0;
            }

            function getParlayProfit(rows) {
                const grouped = new Map();

                rows.forEach(row => {
                    const parlayId = String(row.parlay_id || "single").trim() || "single";
                    if (!grouped.has(parlayId)) {
                        grouped.set(parlayId, {
                            stake: 0,
                            payout: 0,
                            profit: 0,
                            status: "pending",
                            legs: []
                        });
                    }

                    const entry = grouped.get(parlayId);
                    const rowStatus = getStatusValue(row.status);
                    const rowProfit = getLegProfit(row);

                    entry.stake += parseMoney(row.stake);
                    entry.payout += parseMoney(row.potential_payout || row.payout);
                    entry.legs.push({ ...row, status: rowStatus, profit: rowProfit });

                    if (entry.profit === 0 && rowProfit !== 0) {
                        entry.profit = rowProfit;
                    }
                });

                let totalProfit = 0;
                let totalStake = 0;

                grouped.forEach(entry => {
                    totalStake += entry.stake;

                    const profitValues = entry.legs
                        .map(leg => leg.profit)
                        .filter(value => Number.isFinite(value));

                    if (profitValues.length) {
                        const firstProfit = profitValues[0];
                        const allSame = profitValues.every(value => value === firstProfit);
                        entry.profit = allSame ? firstProfit : entry.legs.some(leg => leg.status === "lost") ? -Math.abs(entry.stake || firstProfit) : firstProfit;
                    }

                    totalProfit += entry.profit;
                });

                return { totalProfit, totalStake };
            }

            function groupByParlay(rows) {
                const map = new Map();

                rows.forEach(row => {
                    const parlayId = String(row.parlay_id || "single").trim() || "single";

                    if (!map.has(parlayId)) {
                        map.set(parlayId, {
                            id: parlayId,
                            sportsbook: row.sportsbook || "Unknown",
                            legs: []
                        });
                    }

                    const group = map.get(parlayId);
                    const status = getStatusValue(row.status);
                    const profit = getLegProfit(row);

                    group.legs.push({
                        name: row.bet_name || row.market_name || "Bet",
                        sportsbook: row.sportsbook || "Unknown",
                        status,
                        profit,
                        bet_profit: row.bet_profit || ""
                    });

                    if (!group.sportsbook || group.sportsbook === "Unknown") {
                        group.sportsbook = row.sportsbook || "Unknown";
                    }
                });

                return [...map.values()].map(group => {
                    const nonEmptyProfitValues = group.legs
                        .map(leg => parseMoney(leg.bet_profit))
                        .filter(value => value !== 0 || (group.legs.some(leg => leg.bet_profit && String(leg.bet_profit).trim() !== "") && group.legs.some(leg => leg.bet_profit && String(leg.bet_profit).trim() === "")) ? false : true);

                    const parlayProfit = (() => {
                        const betProfitValues = group.legs
                            .map(leg => parseMoney(leg.bet_profit))
                            .filter(value => Number.isFinite(value) && value !== 0 || (leg => leg.bet_profit !== undefined && String(leg.bet_profit).trim() !== ""));
                        const explicitProfitValue = group.legs
                            .map(leg => parseMoney(leg.bet_profit))
                            .find(value => value !== 0 || String(group.legs.find(leg => leg.bet_profit && String(leg.bet_profit).trim() !== "")?.bet_profit || "").trim() !== "");

                        if (explicitProfitValue !== undefined && explicitProfitValue !== null && !(explicitProfitValue === 0 && group.legs.every(leg => !String(leg.bet_profit || "").trim()))) {
                            return explicitProfitValue;
                        }

                        const totalLegProfit = group.legs.reduce((sum, leg) => sum + leg.profit, 0);
                        if (group.legs.some(leg => leg.status === "lost")) {
                            return totalLegProfit < 0 ? totalLegProfit : -Math.abs(group.legs.reduce((sum, leg) => sum + parseMoney(leg.bet_profit || leg.stake || 0), 0));
                        }
                        return totalLegProfit;
                    })();

                    const groupStatus = group.legs.every(leg => leg.status === "won")
                        ? "won"
                        : group.legs.some(leg => leg.status === "lost")
                            ? "lost"
                            : "pending";

                    return {
                        ...group,
                        profit: parlayProfit,
                        status: groupStatus
                    };
                });
            }

            function formatCurrency(value) {
                return `$${Math.abs(value).toFixed(2)}`;
            }

            function renderDashboard(rows) {
                const record = computeRecord(rows);
                const profitInfo = getParlayProfit(rows);

                document.getElementById("recordValue").textContent = `${record.wins}-${record.losses}`;
                document.getElementById("profitValue").textContent = `$${profitInfo.totalProfit.toFixed(2)}`;

                const roi = profitInfo.totalStake > 0 ? (profitInfo.totalProfit / profitInfo.totalStake) * 100 : 0;
                document.getElementById("roiValue").textContent = `${roi.toFixed(1)}%`;

                const details = document.getElementById("betDetails");
                const groups = groupByParlay(rows);

                if (!groups.length) {
                    details.innerHTML = '<div class="bet-details-empty">No bet data loaded.</div>';
                    return;
                }

                details.innerHTML = groups.map(group => {
                    const statusClass = group.status === "won" ? "profit-win" : group.status === "lost" ? "profit-loss" : "profit-pending";
                    const profitDisplay = `${group.status.toUpperCase()} ${formatCurrency(group.profit)}`;

                    return `
                        <div class="bet-entry">
                            <div class="bet-entry-row parlay-header">
                                <div class="parlay-header-left">
                                    <span class="label">Parlay #${group.id}</span>
                                    <span class="sportsbook-tag">${group.sportsbook}</span>
                                </div>
                                <span class="parlay-profit ${statusClass}">${profitDisplay}</span>
                            </div>
                            ${group.legs.map(leg => `
                                <div class="bet-entry-row">
                                    <span class="label">${leg.name}</span>
                                    <span class="value status-${leg.status}">${leg.status.toUpperCase()}</span>
                                </div>
                            `).join("")}
                        </div>
                    `;
                }).join("");
            }

            loadBetRows();
        </script>
    </body>
</html>
