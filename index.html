<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Stats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #fff;
            color: #111;
        }

        .navbar {
            border-bottom: 1px solid #ddd;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            gap: 20px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        .nav-links a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #111;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #111;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            background: #fff;
            border-color: #777;
            box-shadow: none;
        }

        .search-input::placeholder {
            color: #555;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            color: #111;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: none;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 12px 14px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-result-item:hover {
            background: #f5f5f5;
        }

        .result-name {
            font-weight: 500;
        }

        .result-team {
            color: #555;
            font-size: 12px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .hero p {
            color: #555;
            font-size: 18px;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            transition: none;
        }

        .stat-card:hover {
            border-color: #aaa;
            box-shadow: none;
        }


        .schedule-section { margin: 0 auto 44px; }
        .schedule-header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px; }
        .schedule-header h2 { font-size:1.65rem; }
        .date-controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .date-controls button, .date-controls input { background:#fff; color:#111; border:1px solid #ccc; border-radius:4px; padding:8px 10px; font:inherit; }
        .date-controls button { cursor:pointer; }
        .date-controls button:hover { background:#f5f5f5; }
        #selectedDateLabel { color:#666; min-width:150px; text-align:center; }
        .games-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; }
        .game-card { background:#fff; border:1px solid #ddd; border-radius:4px; padding:16px; }
        .game-status { color:#555; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; }
        .team-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; }
        .team-name { font-weight:600; }
        .team-record { color:#666; font-size:12px; margin-top:3px; }
        .team-score { font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; }
        .game-footer { border-top:1px solid #eee; margin-top:12px; padding-top:12px; color:#666; font-size:12px; }
        .schedule-message { color:#555; padding:24px; text-align:center; border:1px solid #ddd; border-radius:4px; }

        @media (max-width: 768px) {
            .navbar-content {
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                gap: 16px;
            }

            .search-container {
                max-width: 100%;
            }

            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#stats">Stats</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
            <div class="search-container">
                <input 
                    type="text" 
                    id="playerSearch" 
                    class="search-input" 
                    placeholder="Search players..."
                    autocomplete="off"
                >
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero" id="home">
            <h1>NBA Dashboard</h1>
            <p>Player statistics</p>
        </div>

        <section class="schedule-section" id="games" aria-labelledby="dailySlateTitle">
            <div class="schedule-header">
                <h2 id="dailySlateTitle">NBA Daily Slate</h2>
                <div class="date-controls">
                    <button type="button" id="previousDate" aria-label="Previous day">‹ Prev</button>
                    <input type="date" id="slateDate" aria-label="Select slate date">
                    <button type="button" id="nextDate" aria-label="Next day">Next ›</button>
                    <button type="button" id="todayDate">Today</button>
                </div>
            </div>
            <div id="gamesGrid" class="games-grid">
                <div class="schedule-message">Loading NBA games…</div>
            </div>
        </section>

        <div class="schedule-header" id="stats">
            <h2>Player Statistics</h2>
        </div>
        <div class="stats-section" id="statsSection">
            <!-- Stats will load here -->
        </div>
    </div>

    <script>
        const STATS_CSV_URL = 'https://raw.githubusercontent.com/cavjue/NBA_Stats/main/PlayerStatistics.csv';
        let allPlayers = [];

        // Daily NBA slate (ESPN scoreboard feed)
        const SCOREBOARD_URL = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
        const slateDateInput = document.getElementById('slateDate');
        const gamesGrid = document.getElementById('gamesGrid');

        function formatDateForApi(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function dateFromInput(value) {
            const parts = value.split('-').map(Number);
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function setSlateDate(date) {
            const normalized = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            slateDateInput.value = `${normalized.getFullYear()}-${String(normalized.getMonth() + 1).padStart(2, '0')}-${String(normalized.getDate()).padStart(2, '0')}`;
            loadDailySlate(normalized);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function renderDailySlate(data) {
            const events = data.events || [];
            if (!events.length) {
                gamesGrid.innerHTML = '<div class="schedule-message">No NBA games scheduled for this date.</div>';
                return;
            }

            gamesGrid.innerHTML = events.map((event) => {
                const competition = event.competitions?.[0];
                const competitors = competition?.competitors || [];
                const home = competitors.find((team) => team.homeAway === 'home') || competitors[0] || {};
                const away = competitors.find((team) => team.homeAway === 'away') || competitors[1] || {};
                const status = event.status?.type?.detail || event.status?.type?.shortDetail || 'Scheduled';
                const isCompleted = event.status?.type?.completed;
                const isLive = event.status?.type?.state === 'in';
                const displayTeam = (team) => team.team?.displayName || team.team?.shortDisplayName || 'TBD';
                const score = (team) => team.score !== undefined ? escapeHtml(team.score) : '—';
                const gameTime = event.date ? new Date(event.date).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
                const venue = competition?.venue?.fullName || '';
                return `
                    <article class="game-card">
                        <div class="game-status">${escapeHtml(status)}</div>
                        <div class="team-row">
                            <div><div class="team-name">${escapeHtml(displayTeam(away))}</div><div class="team-record">${escapeHtml(away.records?.[0]?.summary || '')}</div></div>
                            <div class="team-score">${isCompleted || isLive ? score(away) : '—'}</div>
                        </div>
                        <div class="team-row">
                            <div><div class="team-name">${escapeHtml(displayTeam(home))}</div><div class="team-record">${escapeHtml(home.records?.[0]?.summary || '')}</div></div>
                            <div class="team-score">${isCompleted || isLive ? score(home) : '—'}</div>
                        </div>
                        <div class="game-footer">${escapeHtml(gameTime)}${venue ? ' · ' + escapeHtml(venue) : ''}</div>
                    </article>`;
            }).join('');
        }

        async function loadDailySlate(date) {
            gamesGrid.innerHTML = '<div class="schedule-message">Loading NBA games…</div>';
            try {
                const response = await fetch(`${SCOREBOARD_URL}?dates=${formatDateForApi(date)}`);
                if (!response.ok) throw new Error(`Scoreboard request failed (${response.status})`);
                const data = await response.json();
                renderDailySlate(data);
            } catch (error) {
                console.error('Error loading NBA daily slate:', error);
                gamesGrid.innerHTML = '<div class="schedule-message">Could not load the NBA slate. Please try again later.</div>';
            }
        }

        document.getElementById('previousDate').addEventListener('click', () => {
            const date = dateFromInput(slateDateInput.value);
            date.setDate(date.getDate() - 1);
            setSlateDate(date);
        });
        document.getElementById('nextDate').addEventListener('click', () => {
            const date = dateFromInput(slateDateInput.value);
            date.setDate(date.getDate() + 1);
            setSlateDate(date);
        });
        document.getElementById('todayDate').addEventListener('click', () => setSlateDate(new Date()));
        slateDateInput.addEventListener('change', () => {
            if (slateDateInput.value) setSlateDate(dateFromInput(slateDateInput.value));
        });
        setSlateDate(new Date());

        // Parse CSV function
        function parseCSV(text) {
            const rows = [];
            const lines = text.trim().split(/\r?\n/);

            for (const line of lines) {
                const values = [];
                let current = '';
                let inQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];

                    if (char === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        values.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }

                values.push(current);
                rows.push(values);
            }

            return rows;
        }

        // Get header index by looking for partial matches
        function getHeaderIndex(headers, candidates) {
            const normalized = headers.map((h) => (h || '').trim().toLowerCase());
            for (const candidate of candidates) {
                const idx = normalized.findIndex((name) => name.includes(candidate));
                if (idx !== -1) return idx;
            }
            return -1;
        }

        // Convert player name to filename format (capitalize each word, replace spaces with hyphens)
        function playerNameToFilename(playerName) {
            return playerName
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                .join('-');
        }

        // Load and parse CSV data
        function loadPlayerData() {
            fetch(STATS_CSV_URL)
                .then((response) => {
                    if (!response.ok) throw new Error('CSV not found');
                    return response.text();
                })
                .then((csv) => {
                    const rows = parseCSV(csv);
                    const headers = rows[0].map((h) => String(h).trim());

                    const firstNameIndex = getHeaderIndex(headers, ['firstname']);
                    const lastNameIndex = getHeaderIndex(headers, ['lastname']);
                    const teamCityIndex = getHeaderIndex(headers, ['playerteamcity']);
                    const teamNameIndex = getHeaderIndex(headers, ['playerteamname']);

                    // Extract unique players
                    const playerMap = {};
                    for (let i = 1; i < rows.length; i++) {
                        const firstName = (rows[i][firstNameIndex] || '').trim();
                        const lastName = (rows[i][lastNameIndex] || '').trim();
                        const teamCity = (rows[i][teamCityIndex] || '').trim();
                        const teamName = (rows[i][teamNameIndex] || '').trim();

                        if (!firstName || !lastName) continue;

                        const key = `${firstName} ${lastName}`.toLowerCase();
                        if (!playerMap[key]) {
                            playerMap[key] = {
                                firstName,
                                lastName,
                                team: `${teamCity} ${teamName}`.trim(),
                                display: `${firstName} ${lastName}`
                            };
                        }
                    }

                    allPlayers = Object.values(playerMap).sort((a, b) =>
                        a.display.localeCompare(b.display)
                    );

                    initializeSearch();
                })
                .catch((error) => {
                    console.error('Error loading player data:', error);
                });
        }

        // Initialize search functionality
        function initializeSearch() {
            const searchInput = document.getElementById('playerSearch');
            const searchResults = document.getElementById('searchResults');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();

                if (query.length < 1) {
                    searchResults.classList.remove('active');
                    return;
                }

                const filtered = allPlayers.filter((player) =>
                    player.display.toLowerCase().includes(query)
                ).slice(0, 8); // Limit to 8 results

                if (filtered.length === 0) {
                    searchResults.classList.remove('active');
                    return;
                }

                searchResults.innerHTML = filtered.map((player) => `
                    <div class="search-result-item" data-player="${player.display}">
                        <div>
                            <div class="result-name">${player.display}</div>
                            <div class="result-team">${player.team || 'Team TBD'}</div>
                        </div>
                    </div>
                `).join('');

                searchResults.classList.add('active');

                // Add click handlers
                document.querySelectorAll('.search-result-item').forEach((item) => {
                    item.addEventListener('click', () => {
                        navigateToPlayer(item.dataset.player);
                    });
                });
            });

            // Close results when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    searchResults.classList.remove('active');
                }
            });
        }

        // Navigate to player page
        function navigateToPlayer(playerName) {
            // Convert player name to proper filename format: First-Last (capitalized, hyphenated)
            const urlName = playerNameToFilename(playerName);
            window.location.href = `Players/${urlName}.html`;
        }

        // Load player data on page load
        loadPlayerData();
    </script>
</body>
</html>
