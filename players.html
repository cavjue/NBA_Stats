<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Profile | NBA Stats</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="player-profile">
    <nav class="navbar">
        <div class="navbar-content">
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/stats.html">Stats</a></li>
                <li><a href="/log.html">Log</a></li>
                <li><a href="/articles.html">Articles</a></li>
            </ul>
            <div class="search-container">
                <input 
                    type="text" 
                    id="playerSearch" 
                    class="search-input" 
                    placeholder="Search players..."
                    autocomplete="off"
                >
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </nav>
    
    <div class="page">
      <div class="topbar">
        <div class="tag">Player Profile</div>
      </div>

      <div class="hero">
        <section class="panel player-panel">
          <h1 class="player-name" id="player-name">Loading player...</h1>
          <div class="player-meta" id="player-meta"></div>

          <div class="summary-grid" id="summary-grid"></div>
        </section>

        <aside class="panel side-panel">
          <h3>Quick profile</h3>
          <div class="mini-grid" id="mini-grid"></div>
        </aside>
      </div>

      <div class="main-grid">
        <section class="panel section">
          <div class="section-header">
            <h2>Recent games
              <span>
                <a href="#top">Top</a>
              </span>
            </h2>
          </div>
          <div class="table-scroll">
            <table id="recent-games-table">
              <thead>
                <tr>
                  <th>Game</th>
                  <th>Date</th>
                  <th>Opponent</th>
                  <th>Result</th>
                  <th>MIN</th>
                  <th>FGs</th>
                  <th>3PT FGs</th>
                  <th>FTs</th>
                  <th>PTS</th>
                  <th>AST</th>
                  <th>REB</th>
                  <th>STL</th>
                  <th>BLK</th>
                  <th>TO</th>
                </tr>
              </thead>
              <tbody id="recent-games"></tbody>
            </table>
          </div>
        </section>

        <aside class="panel section">
          <div class="section-header">
            <h2>Splits</h2>
          </div>
          <div class="table-scroll">
            <table id="splits-table">
              <thead>
                <tr id="splits-table-head"></tr>
              </thead>
              <tbody>
                <tr id="splits-table-values"></tr>
              </tbody>
            </table>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const STATS_URL = 'https://raw.githubusercontent.com/cavjue/NBA_Stats/main/Data/PlayerStatistics.csv';
      const requestedPlayer = new URLSearchParams(window.location.search).get('player') || 'Luka Doncic';

      function parseCSV(text) {
        const rows = [];
        const lines = text.trim().split(/\r?\n/);

        for (const line of lines) {
          const values = [];
          let current = '';
          let inQuotes = false;

          for (let i = 0; i < line.length; i++) {
            const char = line[i];

            if (char === '"') {
              if (inQuotes && line[i + 1] === '"') {
                current += '"';
                i++;
              } else {
                inQuotes = !inQuotes;
              }
            } else if (char === ',' && !inQuotes) {
              values.push(current);
              current = '';
            } else {
              current += char;
            }
          }

          values.push(current);
          rows.push(values);
        }

        return rows;
      }

      function getHeaderIndex(headers, candidates) {
        const normalized = headers.map((h) => (h || '').trim().toLowerCase());
        for (const candidate of candidates) {
          const idx = normalized.findIndex((name) => name.includes(candidate));
          if (idx !== -1) return idx;
        }
        return -1;
      }

      function toNumber(value) {
        if (value === undefined || value === null || value === '') return null;
        const num = Number.parseFloat(String(value).replace(/[^0-9.-]/g, ''));
        return Number.isFinite(num) ? num : null;
      }

      function formatDate(dateString) {
        if (!dateString) return '—';
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return dateString;
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function average(values) {
        const valid = values.filter((v) => v !== null && Number.isFinite(v));
        if (!valid.length) return 0;
        return valid.reduce((sum, value) => sum + value, 0) / valid.length;
      }

      function normalizeName(value) {
        return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
      }

      function populatePage(rows) {
        if (!rows.length || !rows[0].length) {
          document.getElementById('player-name').textContent = requestedPlayer;
          document.getElementById('player-meta').innerHTML = '<span>Player data is unavailable</span>';
          return;
        }

        const headers = rows[0].map((h) => String(h).trim());
        const firstNameIndex = getHeaderIndex(headers, ['firstname']);
        const lastNameIndex = getHeaderIndex(headers, ['lastname']);
        const teamCityIndex = getHeaderIndex(headers, ['playerteamcity']);
        const teamNameIndex = getHeaderIndex(headers, ['playerteamname']);
        const playerRows = rows.slice(1).filter((row) =>
          normalizeName(`${row[firstNameIndex] || ''} ${row[lastNameIndex] || ''}`) === normalizeName(requestedPlayer)
        );

        const oppCityIndex = getHeaderIndex(headers, ['opponentteamcity']);
        const oppNameIndex = getHeaderIndex(headers, ['opponentteamname']);
        const dateIndex = getHeaderIndex(headers, ['gamedatetimeest', 'date']);
        const winIndex = getHeaderIndex(headers, ['win']);
        const pointsIndex = getHeaderIndex(headers, ['points']);
        const assistsIndex = getHeaderIndex(headers, ['assist']);
        const reboundsIndex = getHeaderIndex(headers, ['reboundstotal', 'rebound']);
        const stealsIndex = getHeaderIndex(headers, ['steals']);
        const blocksIndex = getHeaderIndex(headers, ['blocks']);
        const turnoversIndex = getHeaderIndex(headers, ['turnovers']);
        const fieldGoalsMadeIndex = getHeaderIndex(headers, ['fieldgoalsmade']);
        const fieldGoalsAttemptedIndex = getHeaderIndex(headers, ['fieldgoalsattempted']);
        const threePointersMadeIndex = getHeaderIndex(headers, ['threepointersmade']);
        const threePointersAttemptedIndex = getHeaderIndex(headers, ['threepointersattempted']);
        const freeThrowsMadeIndex = getHeaderIndex(headers, ['freethrowsmade']);
        const freeThrowsAttemptedIndex = getHeaderIndex(headers, ['freethrowsattempted']);
        const plusMinusIndex = getHeaderIndex(headers, ['plusminuspoints']);
        const minutesIndex = getHeaderIndex(headers, ['minutes']);
        const gameLabelIndex = getHeaderIndex(headers, ['gamelabel']);
        const gameSubLabelIndex = getHeaderIndex(headers, ['gamesublabel']);
        if (!playerRows.length) {
          document.title = `${requestedPlayer} | Player Profile`;
          document.getElementById('player-name').textContent = requestedPlayer;
          document.getElementById('player-meta').innerHTML = '<span>Player not found in available stats</span>';
          return;
        }

        const cleanedRows = playerRows.map((row) => ({
          firstName: row[firstNameIndex] || '',
          lastName: row[lastNameIndex] || '',
          team: `${row[teamCityIndex] || ''} ${row[teamNameIndex] || ''}`.trim(),
          opponent: `${row[oppCityIndex] || ''} ${row[oppNameIndex] || ''}`.trim(),
          date: row[dateIndex] || '',
          win: row[winIndex] === '1' || row[winIndex] === 'true' || row[winIndex] === 'True',
          points: toNumber(row[pointsIndex]),
          assists: toNumber(row[assistsIndex]),
          rebounds: toNumber(row[reboundsIndex]),
          steals: toNumber(row[stealsIndex]),
          blocks: toNumber(row[blocksIndex]),
          turnovers: toNumber(row[turnoversIndex]),
          fieldGoalsMade: toNumber(row[fieldGoalsMadeIndex]),
          fieldGoalsAttempted: toNumber(row[fieldGoalsAttemptedIndex]),
          threePointersMade: toNumber(row[threePointersMadeIndex]),
          threePointersAttempted: toNumber(row[threePointersAttemptedIndex]),
          freeThrowsMade: toNumber(row[freeThrowsMadeIndex]),
          freeThrowsAttempted: toNumber(row[freeThrowsAttemptedIndex]),
          plusMinus: toNumber(row[plusMinusIndex]),
          minutes: toNumber(row[minutesIndex]),
          gameLabel: row[gameLabelIndex] || '',
          gameSubLabel: row[gameSubLabelIndex] || ''
        }));

        const sorted = [...cleanedRows].sort((a, b) => {
          const da = new Date(a.date); const db = new Date(b.date);
          return da - db;
        });

        const wins = sorted.filter((r) => r.win).length;
        const losses = sorted.length - wins;
        const ppg = average(sorted.map((r) => r.points));
        const apg = average(sorted.map((r) => r.assists));
        const rpg = average(sorted.map((r) => r.rebounds));
        const mpg = average(sorted.map((r) => r.minutes));

        const displayName = `${cleanedRows[0].firstName} ${cleanedRows[0].lastName}`;
        document.title = `${displayName} | Player Profile`;
        document.getElementById('player-name').textContent = displayName;
        document.getElementById('player-meta').innerHTML = `
          <span>${escapeHtml(cleanedRows[0].team)}</span>
          <span>NBA</span>
          <span>${sorted.length} games tracked</span>
        `;

        const summaryCards = [
          { label: 'Record', value: `${wins}-${losses}`, note: 'all games' },
          { label: 'PPG', value: ppg.toFixed(1), note: 'points' },
          { label: 'APG', value: apg.toFixed(1), note: 'assists' },
          { label: 'RPG', value: rpg.toFixed(1), note: 'rebounds' }
        ];

        document.getElementById('summary-grid').innerHTML = summaryCards.map((card) => `
          <div class="stat-card">
            <span class="label">${card.label}</span>
            <span class="value">${card.value}</span>
            <span class="note">${card.note}</span>
          </div>
        `).join('');

        const mini = [
          { label: 'MPG', value: mpg.toFixed(1) },
          { label: 'Win %', value: `${((wins / sorted.length) * 100 || 0).toFixed(1)}%` },
          { label: 'Games', value: String(sorted.length) },
          { label: 'Last 10', value: `${sorted.slice(-10).filter((r) => r.win).length}-${sorted.slice(-10).filter((r) => !r.win).length}` }
        ];

        document.getElementById('mini-grid').innerHTML = mini.map((item) => `
          <div class="mini">
            <span class="label">${item.label}</span>
            <span class="value">${item.value}</span>
          </div>
        `).join('');

        const recentGames = [...sorted].slice(-8).reverse();
        const formatShootingLine = (made, attempted) =>
          made === null || attempted === null ? '—' : `${made}-${attempted}`;
        const recentHtml = recentGames.map((game) => `
          <tr>
            <td>${escapeHtml(game.gameLabel || 'Game')}${game.gameSubLabel ? ` / ${escapeHtml(game.gameSubLabel)}` : ''}</td>
            <td>${formatDate(game.date)}</td>
            <td>${escapeHtml(game.opponent || '—')}</td>
            <td class="${game.win ? 'win' : 'loss'}">${game.win ? 'W' : 'L'}</td>
            <td>${game.minutes === null ? '—' : Math.round(game.minutes)}</td>
            <td>${formatShootingLine(game.fieldGoalsMade, game.fieldGoalsAttempted)}</td>
            <td>${formatShootingLine(game.threePointersMade, game.threePointersAttempted)}</td>
            <td>${formatShootingLine(game.freeThrowsMade, game.freeThrowsAttempted)}</td>
            <td>${game.points ?? '—'}</td>
            <td>${game.assists ?? '—'}</td>
            <td>${game.rebounds ?? '—'}</td>
            <td>${game.steals ?? '—'}</td>
            <td>${game.blocks ?? '—'}</td>
            <td>${game.turnovers ?? '—'}</td>
          </tr>
        `).join('');

        document.getElementById('recent-games').innerHTML = recentHtml;

        const shootingPercentage = (madeKey, attemptedKey) => {
          const made = sorted.reduce((sum, game) => sum + (game[madeKey] || 0), 0);
          const attempted = sorted.reduce((sum, game) => sum + (game[attemptedKey] || 0), 0);
          return attempted ? `${(made / attempted * 100).toFixed(1)}%` : '—';
        };
        const splitStats = [
          { name: 'Games', value: String(sorted.length) },
          { name: 'Record', value: `${wins}-${losses}` },
          { name: 'PTS', value: ppg.toFixed(1) },
          { name: 'REB', value: rpg.toFixed(1) },
          { name: 'AST', value: apg.toFixed(1) },
          { name: 'STL', value: average(sorted.map((game) => game.steals)).toFixed(1) },
          { name: 'BLK', value: average(sorted.map((game) => game.blocks)).toFixed(1) },
          { name: 'TOV', value: average(sorted.map((game) => game.turnovers)).toFixed(1) },
          { name: 'FG%', value: shootingPercentage('fieldGoalsMade', 'fieldGoalsAttempted') },
          { name: '3P%', value: shootingPercentage('threePointersMade', 'threePointersAttempted') },
          { name: 'FT%', value: shootingPercentage('freeThrowsMade', 'freeThrowsAttempted') },
          { name: '+/-', value: average(sorted.map((game) => game.plusMinus)).toFixed(1) },
          { name: 'MIN', value: mpg.toFixed(1) }
        ];

        document.getElementById('splits-table-head').innerHTML = splitStats.map((item) => `
          <th scope="col">${escapeHtml(item.name)}</th>
        `).join('');
        document.getElementById('splits-table-values').innerHTML = splitStats.map((item) => `
          <td>${escapeHtml(item.value)}</td>
        `).join('');
      }

      fetch(STATS_URL)
        .then((response) => {
          if (!response.ok) throw new Error('CSV not found');
          return response.text();
        })
        .then((csv) => {
          const rows = parseCSV(csv);
          populatePage(rows);
          initializeSearch(rows);
        })
        .catch((error) => {
          console.error(error);
          document.getElementById('player-name').textContent = requestedPlayer;
          document.getElementById('player-meta').innerHTML = '<span>Unable to load CSV data</span>';
        });

      function initializeSearch(rows) {
        const headers = rows[0].map((header) => String(header).trim());
        const firstNameIndex = getHeaderIndex(headers, ['firstname']);
        const lastNameIndex = getHeaderIndex(headers, ['lastname']);
        const teamCityIndex = getHeaderIndex(headers, ['playerteamcity']);
        const teamNameIndex = getHeaderIndex(headers, ['playerteamname']);
        const players = new Map();

        rows.slice(1).forEach((row) => {
          const firstName = (row[firstNameIndex] || '').trim();
          const lastName = (row[lastNameIndex] || '').trim();
          if (!firstName || !lastName) return;
          const name = `${firstName} ${lastName}`;
          players.set(normalizeName(name), {
            name,
            team: `${row[teamCityIndex] || ''} ${row[teamNameIndex] || ''}`.trim()
          });
        });

        const searchInput = document.getElementById('playerSearch');
        const searchResults = document.getElementById('searchResults');
        searchInput.addEventListener('input', () => {
          const query = normalizeName(searchInput.value);
          const matches = [...players.values()].filter((player) => normalizeName(player.name).includes(query)).slice(0, 8);
          searchResults.innerHTML = matches.map((player) => `
            <div class="search-result-item" data-player="${escapeHtml(player.name)}">
              <div><div class="result-name">${escapeHtml(player.name)}</div><div class="result-team">${escapeHtml(player.team || 'Team TBD')}</div></div>
            </div>
          `).join('');
          searchResults.classList.toggle('active', query.length > 0 && matches.length > 0);
        });
        searchResults.addEventListener('click', (event) => {
          const item = event.target.closest('.search-result-item');
          if (!item) return;
          const profileUrl = new URL(window.location.href);
          profileUrl.searchParams.set('player', item.dataset.player);
          window.location.href = profileUrl;
        });
        document.addEventListener('click', (event) => {
          if (!event.target.closest('.search-container')) searchResults.classList.remove('active');
        });
      }
    </script>
  </body>
</html>
